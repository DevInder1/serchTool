<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search Tool — Product Finder</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #e7ebf0;
    --muted: #9aa4b2; --accent: #4f8cff; --accent-ink: #fff; --chip: #202634;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fa; --panel: #fff; --border: #e2e6ee; --text: #1b1f27;
      --muted: #5b6675; --accent: #2f6fed; --accent-ink: #fff; --chip: #eef2f8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 28px 20px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 2px; font-size: 24px; }
  .sub { color: var(--muted); margin: 0; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 20px 60px; }
  .controls { display: grid; grid-template-columns: 2fr 1.4fr auto; gap: 10px;
              background: var(--panel); border: 1px solid var(--border);
              border-radius: 14px; padding: 14px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 12px; color: var(--muted); }
  input, select { background: var(--bg); color: var(--text); border: 1px solid var(--border);
                  border-radius: 9px; padding: 10px 11px; font-size: 15px; width: 100%; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 10px; margin-top: 10px; }
  button { background: var(--accent); color: var(--accent-ink); border: 0; cursor: pointer;
           border-radius: 9px; padding: 11px 20px; font-size: 15px; font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  .bar { display: flex; justify-content: space-between; align-items: center;
         margin: 22px 0 10px; gap: 10px; flex-wrap: wrap; }
  .status { color: var(--muted); font-size: 14px; }
  .ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
          overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; height: 150px; object-fit: cover; background: var(--chip); }
  .card .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .title { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .price { font-size: 18px; font-weight: 700; }
  .meta { color: var(--muted); font-size: 12px; }
  .tag { display: inline-block; background: var(--chip); color: var(--muted);
         border-radius: 999px; padding: 2px 9px; font-size: 11px; }
  .card a { margin-top: auto; text-decoration: none; color: var(--accent); font-size: 13px; font-weight: 600; }
  .note { background: var(--chip); border: 1px solid var(--border); border-radius: 10px;
          padding: 10px 12px; color: var(--muted); font-size: 13px; margin-top: 12px; }
  @media (max-width: 720px) { .controls, .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>🔎 Search Tool</h1>
  <p class="sub">Find product listings and prices by location.</p>
</header>
<div class="wrap">
  <div class="controls">
    <div class="field">
      <label for="q">Product</label>
      <input id="q" placeholder="e.g. leather sofa, running shoes, coffee beans" />
    </div>
    <div class="field">
      <label for="loc">Location</label>
      <input id="loc" value="Bangalore, India" />
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button id="go">Search</button>
    </div>
  </div>
  <div class="row2">
    <div class="field">
      <label for="min">Min price</label>
      <input id="min" type="number" min="0" placeholder="any" />
    </div>
    <div class="field">
      <label for="max">Max price</label>
      <input id="max" type="number" min="0" placeholder="any" />
    </div>
    <div class="field">
      <label for="src">Source</label>
      <select id="src"><option value="">All available</option></select>
    </div>
  </div>

  <div class="bar">
    <span class="status" id="status">Enter a product and press Search.</span>
    <button class="ghost" id="csv" disabled>Export CSV</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note" id="providerNote"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let lastResults = [];

function fmtPrice(item) {
  if (item.price == null) return "Price on site";
  const cur = item.currency || "";
  return `${cur} ${item.price.toLocaleString()}`.trim();
}

async function loadProviders() {
  try {
    const r = await fetch("/api/providers");
    const d = await r.json();
    const sel = $("src");
    const active = d.providers.filter(p => p.enabled).map(p => p.name);
    d.providers.forEach(p => {
      const o = document.createElement("option");
      o.value = p.name;
      const hint = p.name === "mock" ? " (demo — off)" : " (needs key)";
      o.textContent = p.enabled ? p.name : p.name + hint;
      o.disabled = !p.enabled;
      sel.appendChild(o);
    });
    const dataActive = active.filter(n => n !== "marketplaces");
    $("providerNote").textContent = dataActive.length
      ? `Live providers active: ${active.join(", ")}.`
      : "Showing marketplace searches on OLX, Facebook, Instagram, IndiaMART and Quikr. Add a SERPAPI_KEY or APIFY_* actor to also pull in priced listings.";
  } catch (e) {}
}

async function doSearch() {
  const query = $("q").value.trim();
  if (!query) { $("status").textContent = "Type a product first."; return; }
  $("go").disabled = true;
  $("status").textContent = "Searching…";
  $("grid").innerHTML = "";
  const body = {
    query,
    location: $("loc").value.trim() || "Bangalore, India",
    min_price: $("min").value ? Number($("min").value) : null,
    max_price: $("max").value ? Number($("max").value) : null,
    sources: $("src").value ? [$("src").value] : null,
    limit: 40,
  };
  try {
    const r = await fetch("/api/search", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    lastResults = d.results;
    render(d);
  } catch (e) {
    $("status").textContent = "Something went wrong: " + e.message;
  } finally {
    $("go").disabled = false;
  }
}

function render(d) {
  const grid = $("grid");
  grid.innerHTML = "";
  $("status").textContent = `${d.count} result${d.count === 1 ? "" : "s"} for “${d.query}” in ${d.location} · via ${d.providers_used.join(", ")}`;
  $("csv").disabled = d.count === 0;
  d.results.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      ${item.image_url ? `<img src="${item.image_url}" alt="" loading="lazy" onerror="this.remove()"/>` : ""}
      <div class="body">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="price">${fmtPrice(item)}</div>
        <div class="meta">${escapeHtml(item.seller || "Unknown seller")} · <span class="tag">${item.source}</span></div>
        <a href="${item.product_url}" target="_blank" rel="noopener noreferrer">View listing →</a>
      </div>`;
    grid.appendChild(card);
  });
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function exportCsv() {
  const cols = ["title", "price", "currency", "seller", "location", "source", "product_url"];
  const rows = [cols.join(",")].concat(lastResults.map(it =>
    cols.map(c => `"${String(it[c] ?? "").replace(/"/g, '""')}"`).join(",")));
  const blob = new Blob([rows.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "results.csv";
  a.click();
}

$("go").addEventListener("click", doSearch);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
$("loc").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
$("csv").addEventListener("click", exportCsv);
loadProviders();
</script>
</body>
</html>
