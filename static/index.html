<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search Tool — Product Finder</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #e7ebf0;
    --muted: #9aa4b2; --accent: #4f8cff; --accent-ink: #fff; --chip: #202634;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fa; --panel: #fff; --border: #e2e6ee; --text: #1b1f27;
      --muted: #5b6675; --accent: #2f6fed; --accent-ink: #fff; --chip: #eef2f8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 28px 20px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 2px; font-size: 24px; }
  .sub { color: var(--muted); margin: 0; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 20px 60px; }
  .controls { display: grid; grid-template-columns: 2fr 1.4fr auto; gap: 10px;
              background: var(--panel); border: 1px solid var(--border);
              border-radius: 14px; padding: 14px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 12px; color: var(--muted); }
  input, select { background: var(--bg); color: var(--text); border: 1px solid var(--border);
                  border-radius: 9px; padding: 10px 11px; font-size: 15px; width: 100%; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 10px; margin-top: 10px; }
  button { background: var(--accent); color: var(--accent-ink); border: 0; cursor: pointer;
           border-radius: 9px; padding: 11px 20px; font-size: 15px; font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  .bar { display: flex; justify-content: space-between; align-items: center;
         margin: 22px 0 10px; gap: 10px; flex-wrap: wrap; }
  .status { color: var(--muted); font-size: 14px; }
  .ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
          overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; height: 150px; object-fit: cover; background: var(--chip); }
  .card .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .title { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .price { font-size: 18px; font-weight: 700; }
  .meta { color: var(--muted); font-size: 12px; }
  .tag { display: inline-block; background: var(--chip); color: var(--muted);
         border-radius: 999px; padding: 2px 9px; font-size: 11px; }
  .card a { margin-top: auto; text-decoration: none; color: var(--accent); font-size: 13px; font-weight: 600; }
  .note { background: var(--chip); border: 1px solid var(--border); border-radius: 10px;
          padding: 10px 12px; color: var(--muted); font-size: 13px; margin-top: 12px; }
  #watchSection { margin-top: 40px; border-top: 1px solid var(--border); padding-top: 20px; }
  .watchAdd { display: grid; grid-template-columns: 2fr 1.4fr auto; gap: 10px; margin-bottom: 16px; }
  .watch { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
           padding: 14px 16px; margin-bottom: 10px; }
  .watch .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .watch .name { font-weight: 600; font-size: 15px; }
  .watch .loc { color: var(--muted); font-size: 13px; }
  .watch .price { font-size: 20px; font-weight: 700; }
  .watch .line { display: flex; align-items: center; gap: 12px; margin-top: 8px;
                 flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .pill { border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
  .pill.yes { background: rgba(46,160,67,.18); color: #3fb950; }
  .pill.no { background: rgba(248,81,73,.16); color: #f85149; }
  .up { color: #f85149; font-weight: 600; }
  .down { color: #3fb950; font-weight: 600; }
  .watch .actions { display: flex; gap: 8px; }
  .btnlink { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px;
             font-weight: 600; padding: 0; }
  .hist { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px;
          font-size: 12px; color: var(--muted); }
  .hist div { display: flex; justify-content: space-between; padding: 2px 0; }
  .watchtop { cursor: pointer; }
  .listings { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 6px; }
  .listrow { display: flex; justify-content: space-between; align-items: center; gap: 12px;
             padding: 8px 0; border-bottom: 1px solid var(--border); }
  .listrow:last-child { border-bottom: 0; }
  .listmain a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
  .listmain a:hover { text-decoration: underline; }
  .listprice { font-weight: 700; font-size: 14px; white-space: nowrap; }
  @media (max-width: 720px) { .watchAdd { grid-template-columns: 1fr; } }
  @media (max-width: 720px) { .controls, .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>🔎 Search Tool</h1>
  <p class="sub">Find product listings and prices by location.</p>
</header>
<div class="wrap">
  <div class="controls">
    <div class="field">
      <label for="q">Product</label>
      <input id="q" placeholder="e.g. leather sofa, running shoes, coffee beans" />
    </div>
    <div class="field">
      <label for="loc">Location</label>
      <input id="loc" value="Bangalore, India" />
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button id="go">Search</button>
    </div>
  </div>
  <div class="row2">
    <div class="field">
      <label for="min">Min price</label>
      <input id="min" type="number" min="0" placeholder="any" />
    </div>
    <div class="field">
      <label for="max">Max price</label>
      <input id="max" type="number" min="0" placeholder="any" />
    </div>
    <div class="field">
      <label for="src">Source</label>
      <select id="src"><option value="">All available</option></select>
    </div>
  </div>

  <div class="bar">
    <span class="status" id="status">Enter a product and press Search.</span>
    <button class="ghost" id="csv" disabled>Export CSV</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note" id="providerNote"></div>

  <section id="watchSection">
    <div class="bar">
      <h2 style="margin:0;font-size:18px;">📌 Daily watchlist</h2>
      <button class="ghost" id="checkAll">Refresh all</button>
    </div>
    <p class="status" style="margin:0 0 12px;">Track a product once — it re-checks automatically every day and records price &amp; availability.</p>
    <div class="watchAdd">
      <input id="wProduct" placeholder="Product to track (e.g. cbr 650 r)" />
      <input id="wLocation" placeholder="Location" value="Bangalore, India" />
      <button id="wAdd">Track daily</button>
    </div>
    <div id="watchList"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
let lastResults = [];

function fmtPrice(item) {
  if (item.price == null) return "Price on site";
  const cur = item.currency || "";
  return `${cur} ${item.price.toLocaleString()}`.trim();
}

async function loadProviders() {
  try {
    const r = await fetch("/api/providers");
    const d = await r.json();
    const sel = $("src");
    const active = d.providers.filter(p => p.enabled).map(p => p.name);
    d.providers.forEach(p => {
      const o = document.createElement("option");
      o.value = p.name;
      const hint = p.name === "mock" ? " (demo — off)" : " (needs key)";
      o.textContent = p.enabled ? p.name : p.name + hint;
      o.disabled = !p.enabled;
      sel.appendChild(o);
    });
    const dataActive = active.filter(n => n !== "marketplaces");
    $("providerNote").textContent = dataActive.length
      ? `Live providers active: ${active.join(", ")}.`
      : "Showing marketplace searches on OLX, Facebook, Instagram, IndiaMART and Quikr. Add a SERPAPI_KEY or APIFY_* actor to also pull in priced listings.";
  } catch (e) {}
}

async function doSearch() {
  const query = $("q").value.trim();
  if (!query) { $("status").textContent = "Type a product first."; return; }
  $("go").disabled = true;
  $("status").textContent = "Searching…";
  $("grid").innerHTML = "";
  const body = {
    query,
    location: $("loc").value.trim() || "Bangalore, India",
    min_price: $("min").value ? Number($("min").value) : null,
    max_price: $("max").value ? Number($("max").value) : null,
    sources: $("src").value ? [$("src").value] : null,
    limit: 40,
  };
  try {
    const r = await fetch("/api/search", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    lastResults = d.results;
    render(d);
  } catch (e) {
    $("status").textContent = "Something went wrong: " + e.message;
  } finally {
    $("go").disabled = false;
  }
}

function render(d) {
  const grid = $("grid");
  grid.innerHTML = "";
  $("status").textContent = `${d.count} result${d.count === 1 ? "" : "s"} for “${d.query}” in ${d.location} · via ${d.providers_used.join(", ")}`;
  $("csv").disabled = d.count === 0;
  d.results.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      ${item.image_url ? `<img src="${item.image_url}" alt="" loading="lazy" onerror="this.remove()"/>` : ""}
      <div class="body">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="price">${fmtPrice(item)}</div>
        <div class="meta">${escapeHtml(item.seller || "Unknown seller")} · <span class="tag">${item.source}</span></div>
        <a href="${item.product_url}" target="_blank" rel="noopener noreferrer">View listing →</a>
      </div>`;
    grid.appendChild(card);
  });
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function exportCsv() {
  const cols = ["title", "price", "currency", "seller", "location", "source", "product_url"];
  const rows = [cols.join(",")].concat(lastResults.map(it =>
    cols.map(c => `"${String(it[c] ?? "").replace(/"/g, '""')}"`).join(",")));
  const blob = new Blob([rows.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "results.csv";
  a.click();
}

$("go").addEventListener("click", doSearch);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
$("loc").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
$("csv").addEventListener("click", exportCsv);
loadProviders();

function timeAgo(sec) {
  if (!sec) return "never";
  const s = Math.floor(Date.now() / 1000 - sec);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

function priceText(snap) {
  if (!snap) return "—";
  if (snap.min_price == null) return snap.available ? "Listings found (no price data)" : "No results";
  return `${snap.currency || ""} ${snap.min_price.toLocaleString()}`.trim();
}

function changeBadge(w) {
  if (w.change == null || w.change === 0) return "";
  const cls = w.change > 0 ? "up" : "down";
  const arrow = w.change > 0 ? "▲" : "▼";
  const cur = w.latest?.currency || "";
  return `<span class="${cls}">${arrow} ${cur} ${Math.abs(w.change).toLocaleString()}</span>`;
}

function renderListings(snap) {
  if (!snap || !snap.top || !snap.top.length) {
    return `<div class="listrow"><span class="status">No listings captured in the last check.</span></div>`;
  }
  return snap.top.map(it => {
    const price = it.price != null ? `${it.currency || ""} ${it.price.toLocaleString()}`.trim() : "Price on site";
    const meta = [it.seller, it.source].filter(Boolean).map(escapeHtml).join(" · ");
    return `<div class="listrow">
        <div class="listmain">
          <a href="${it.product_url}" target="_blank" rel="noopener noreferrer">${escapeHtml(it.title)}</a>
          <div class="loc">${meta}</div>
        </div>
        <div class="listprice">${price}</div>
      </div>`;
  }).join("");
}

async function loadWatches() {
  const r = await fetch("/api/watches");
  const d = await r.json();
  const box = $("watchList");
  box.innerHTML = "";
  if (!d.watches.length) {
    box.innerHTML = `<p class="status">No tracked products yet. Add one above.</p>`;
    return;
  }
  d.watches.forEach(w => {
    const s = w.latest;
    const el = document.createElement("div");
    el.className = "watch";
    const count = s ? s.total_count : 0;
    el.innerHTML = `
      <div class="head watchtop" data-list="${w.id}" title="Click to see the listings">
        <div>
          <div class="name">▸ ${escapeHtml(w.product)}</div>
          <div class="loc">${escapeHtml(w.location)}</div>
        </div>
        <div style="text-align:right;">
          <div class="price">${priceText(s)}</div>
          <div class="loc">${changeBadge(w)} ${count ? count + " listing" + (count === 1 ? "" : "s") : ""}</div>
        </div>
      </div>
      <div class="line">
        <span class="pill ${s && s.available ? "yes" : "no"}">${s && s.available ? "Available" : "Not found"}</span>
        <span>checked ${timeAgo(s?.checked_at)}</span>
        <span>via ${s ? s.providers.join(", ") : "—"}</span>
        <span style="flex:1;"></span>
        <span class="actions">
          <button class="btnlink" data-list="${w.id}">View listings</button>
          <button class="btnlink" data-check="${w.id}">Check now</button>
          <button class="btnlink" data-hist="${w.id}">History</button>
          <button class="btnlink" data-del="${w.id}" style="color:var(--muted);">Remove</button>
        </span>
      </div>
      <div class="listings" id="list-${w.id}" hidden>${renderListings(s)}</div>
      <div class="hist" id="hist-${w.id}" hidden></div>`;
    box.appendChild(el);
  });

  box.querySelectorAll("[data-list]").forEach(b => b.onclick = () => {
    const box2 = $(`list-${b.dataset.list}`);
    box2.hidden = !box2.hidden;
    const arrow = document.querySelector(`.watchtop[data-list="${b.dataset.list}"] .name`);
    if (arrow) arrow.textContent = (box2.hidden ? "▸ " : "▾ ") + arrow.textContent.slice(2);
  });

  box.querySelectorAll("[data-check]").forEach(b => b.onclick = async () => {
    b.textContent = "Checking…"; b.disabled = true;
    await fetch(`/api/watches/${b.dataset.check}/check`, { method: "POST" });
    loadWatches();
  });
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    await fetch(`/api/watches/${b.dataset.del}`, { method: "DELETE" });
    loadWatches();
  });
  box.querySelectorAll("[data-hist]").forEach(b => b.onclick = () => toggleHistory(b.dataset.hist));
}

async function toggleHistory(id) {
  const box = $(`hist-${id}`);
  if (!box.hidden) { box.hidden = true; return; }
  const r = await fetch(`/api/watches/${id}/history`);
  const d = await r.json();
  box.innerHTML = d.history.length
    ? d.history.map(h => `<div><span>${new Date(h.checked_at * 1000).toLocaleString()}</span>
        <span>${h.min_price != null ? (h.currency || "") + " " + h.min_price.toLocaleString() : (h.available ? "found" : "none")}</span></div>`).join("")
    : "<div>No history yet.</div>";
  box.hidden = false;
}

async function addWatch() {
  const product = $("wProduct").value.trim();
  if (!product) { $("wProduct").focus(); return; }
  $("wAdd").disabled = true; $("wAdd").textContent = "Adding…";
  await fetch("/api/watches", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ product, location: $("wLocation").value.trim() || "Bangalore, India" }),
  });
  $("wProduct").value = "";
  $("wAdd").disabled = false; $("wAdd").textContent = "Track daily";
  loadWatches();
}

$("wAdd").addEventListener("click", addWatch);
$("wProduct").addEventListener("keydown", e => { if (e.key === "Enter") addWatch(); });
$("checkAll").addEventListener("click", async () => {
  const btn = $("checkAll"); btn.disabled = true; btn.textContent = "Refreshing…";
  const ids = Array.from(document.querySelectorAll("[data-check]")).map(b => b.dataset.check);
  for (const id of ids) await fetch(`/api/watches/${id}/check`, { method: "POST" });
  btn.disabled = false; btn.textContent = "Refresh all";
  loadWatches();
});
loadWatches();
</script>
</body>
</html>
